{% extends "base.html" %} {% block content %}
<h1 class="blog-title">
  {{ section.title }}
</h1>
<nav class="home-nav-buttons" aria-label="Blog navigation">
  <a href="{{ get_url(path='@/_index.md') }}" class="pill-btn" aria-label="Go to the home page">Home</a>
  <a href="mailto:giannirosato@proton.me" class="pill-btn" aria-label="Email Gianni Rosato">Email</a>
  <a href="{{ get_url(path='@/gallery/_index.md') }}" class="pill-btn" aria-label="View the gallery">Gallery</a>
</nav>
<section class="blog-posts" aria-label="Blog posts">
  {% for page in section.pages %}
  <article class="blog-post-card">
    <a
      href="{{ page.permalink | safe }}"
      class="blog-post-link"
      aria-label="Read {{ page.title }}"
    >
      <div class="blog-post-date">
        {{ page.date | date(format="%B %d, %Y")}}
      </div>
      <h2>{{ page.title }}</h2>
      <p>{{ page.summary | safe }}</p>
    </a>
  </article>
  {% endfor %}
</section>
{% endblock content %}
