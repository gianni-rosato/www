{% extends "base.html" %} {% block content %}
<nav class="nav-buttons" aria-label="Gallery navigation">
  <a href="/" class="pill-btn" aria-label="Go to the home page">Home</a>
</nav>
<h1>
  {{ section.title }}
</h1>
<section class="gallery" aria-label="{{ section.title }} images">
  {{ section.content | safe }}
</section>
<h1>
  88x31
</h1>
<nav class="footer" aria-label="88x31 links">
  {% for badge in config.extra.badges %}
  <a href="{{ badge.href }}" target="_blank" rel="noopener noreferrer" aria-label="Visit {{ badge.label }}">
    <picture>
      {% if badge.jxl is defined %}
      <source srcset="{{ badge.jxl }}" type="image/jxl" />
      {% endif %}
      <img
        src="{{ badge.webp }}"
        alt="{{ badge.label }} 88x31 badge"
        width="88"
        height="31"
      />
    </picture>
  </a>
  {% endfor %}
</nav>
{% endblock content %}
