{% extends "base.html" %} {% block content %}
<div class="home">
    {{ section.content | safe }}
    <nav class="home-nav-buttons" aria-label="Primary navigation">
      <a href="{{ get_url(path='@/blog/_index.md') }}" class="pill-btn" aria-label="Read the blog">Blog</a>
      <a href="mailto:giannirosato@proton.me" class="pill-btn" aria-label="Email Gianni Rosato">Email</a>
      <a href="{{ get_url(path='@/gallery/_index.md') }}" class="pill-btn" aria-label="View the gallery">Gallery</a>
      <a href="{{ get_url(path='@/projects/_index.md') }}" class="pill-btn" aria-label="View projects">Projects</a>
    </nav>
    <nav class="social-container" aria-label="Social links">
      {% for link in config.extra.social_links %}
      <a href="{{ link.href }}" target="_blank" rel="noopener noreferrer" aria-label="{{ link.label }}">
        <img src="{{ link.icon }}" alt="" aria-hidden="true" />
      </a>
      {% endfor %}
    </nav>
</div>
{% endblock content %}
